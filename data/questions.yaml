questions:
  - id: "aisny-01"
    paper: "AISNY"
    question: "What is the dimensionality of the input and output embeddings (d_model) in the base Transformer model?"
    expected_source: "[AISNY §3.1, p.3]"
    gold_answer_summary: "The base model uses d_model = 512 for input and output embedding dimensions."
    rubric: "Must state 512 (or d_model = 512) and cite Attention Is All You Need."

  - id: "aisny-02"
    paper: "AISNY"
    question: "How many attention heads and what model dimension (d_model) are used in the Transformer-big configuration?"
    expected_source: "[AISNY §5.4, p.9]"
    gold_answer_summary: "Transformer (big) uses 16 attention heads (h = 16), d_model = 1024, and d_ff = 4096."
    rubric: "Must state 16 heads and d_model = 1024."

  - id: "aisny-03"
    paper: "AISNY"
    question: "What dropout rate is applied during training in the Transformer architecture, and where is it applied?"
    expected_source: "[AISNY §5.4, p.9]"
    gold_answer_summary: "A residual dropout rate of P_drop = 0.1 is applied to the output of each sub-layer and to the sums of embeddings and positional encodings."
    rubric: "Must state dropout rate of 0.1 and mention sub-layer outputs and/or embedding sums."

  - id: "aisny-04"
    paper: "AISNY"
    question: "What BLEU score did the Transformer (big) achieve on the WMT 2014 English-to-German translation task?"
    expected_source: "[AISNY §5.1, p.8]"
    gold_answer_summary: "Transformer (big) achieved a BLEU score of 28.4 on the WMT 2014 English-to-German task."
    rubric: "Must state 28.4 BLEU score."

  - id: "moshi-01"
    paper: "Moshi"
    question: "What is the frame rate of the Mimi neural audio codec used in Moshi?"
    expected_source: "[Moshi §2.1, p.3]"
    gold_answer_summary: "Mimi operates at a frame rate of 12.5 Hz, corresponding to a frame every 80 ms."
    rubric: "Must state 12.5 Hz (or 80 ms per frame)."

  - id: "moshi-02"
    paper: "Moshi"
    question: "How does Moshi model conversational dialogue between the user and agent simultaneously?"
    expected_source: "[Moshi §2.2, p.4]"
    gold_answer_summary: "Moshi uses a multi-stream architecture modeling parallel audio streams for both user and agent, allowing simultaneous listening and speaking (full duplex)."
    rubric: "Must explain parallel/multi-stream audio tracks for both user and agent."

  - id: "moshi-03"
    paper: "Moshi"
    question: "What is the 'Inner Monologue' mechanism in Moshi and why is it used?"
    expected_source: "[Moshi §2.3, p.5]"
    gold_answer_summary: "Inner Monologue predicts text tokens slightly before generating audio tokens, conditioning speech generation on linguistic content to improve coherence."
    rubric: "Must mention predicting text tokens before audio tokens to condition speech."

  - id: "moshi-04"
    paper: "Moshi"
    question: "How many acoustic codebooks does the Mimi codec utilize for audio quantization?"
    expected_source: "[Moshi §2.1, p.3]"
    gold_answer_summary: "Mimi uses Residual Vector Quantization (RVQ) with 8 codebooks for 12.5 Hz audio streaming (or up to 32 codebooks in offline settings)."
    rubric: "Must mention 8 codebooks (or RVQ with 8/32 codebooks)."

  - id: "dynchunk-01"
    paper: "DynChunk"
    question: "What is the primary motivation for Dynamic Chunking over fixed-size chunking in hierarchical sequence modeling?"
    expected_source: "[DynChunk §1, p.2]"
    gold_answer_summary: "Dynamic chunking adapts boundary positions dynamically based on sequence semantics rather than arbitrary fixed token lengths, reducing information loss across boundaries."
    rubric: "Must mention adapting chunk boundaries dynamically to semantic units rather than fixed lengths."

  - id: "dynchunk-02"
    paper: "DynChunk"
    question: "How does the Dynamic Chunking model determine segment boundaries end-to-end?"
    expected_source: "[DynChunk §3, p.4]"
    gold_answer_summary: "Boundary predictor heads output boundary probability tokens or transition decisions trained end-to-end with the sequence loss."
    rubric: "Must mention boundary prediction decisions/probabilities trained end-to-end."

  - id: "dynchunk-03"
    paper: "DynChunk"
    question: "What computational complexity benefit does hierarchical dynamic chunking provide for long sequences?"
    expected_source: "[DynChunk §3.2, p.5]"
    gold_answer_summary: "It compresses long sequences into higher-level representations, reducing full quadratic self-attention complexity to sub-quadratic or linear complexity relative to raw sequence length."
    rubric: "Must mention sub-quadratic complexity reduction via chunk compression."

  - id: "cross-01"
    paper: "ALL"
    question: "Compare the parameter count of the base Transformer in Attention Is All You Need with the Moshi speech-text model."
    expected_source: "[AISNY §5.4, p.9] & [Moshi §2, p.3]"
    gold_answer_summary: "The base Transformer has approximately 65 million parameters, whereas Moshi is a foundation model with approximately 7 billion parameters."
    rubric: "Must contrast the ~65M parameter scale of Transformer base with the ~7B scale of Moshi."

  - id: "unanswerable-01"
    paper: "AISNY"
    question: "What was the total training cost in US dollars of training the Transformer model on Google Cloud TPUs?"
    expected_source: "None"
    gold_answer_summary: "UNANSWERABLE: The paper reports training time in TPU days (3.5 days on 8 P100 GPUs for base, 3.5 days on 8 GPUs for big) but does not state dollar training costs."
    rubric: "Must refuse to guess and clearly state that monetary cost is not disclosed in the paper."

  - id: "unanswerable-02"
    paper: "Moshi"
    question: "What Word Error Rate (WER) does OpenAI's Whisper model achieve on LibriSpeech test-clean according to the Moshi paper?"
    expected_source: "None"
    gold_answer_summary: "UNANSWERABLE: While Whisper is cited as related prior work, the Moshi paper does not evaluate or report Whisper's WER on LibriSpeech."
    rubric: "Must refuse to fabricate a WER score and explain that Moshi cites Whisper without reporting this evaluation metric."

  - id: "unanswerable-03"
    paper: "ALL"
    question: "How many attention heads does the encoder use?"
    expected_source: "None"
    gold_answer_summary: "AMBIGUOUS / UNANSWERABLE: The question does not specify which model or paper is being referred to across Attention Is All You Need, Moshi, and Dynamic Chunking."
    rubric: "Must refuse or flag as ambiguous because multiple papers contain encoders with different configurations."

  - id: "unanswerable-04"
    paper: "None"
    question: "What learning rate schedule was used to pre-train OpenAI's GPT-4 base model?"
    expected_source: "None"
    gold_answer_summary: "OUT OF SCOPE: GPT-4 is entirely out-of-corpus; the library contains only Attention Is All You Need, Moshi, and Dynamic Chunking."
    rubric: "Must refuse as out-of-scope."
